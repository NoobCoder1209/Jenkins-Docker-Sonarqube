# SonarQube project metadata. SONAR_HOST_URL and SONAR_TOKEN are injected
# by withSonarQubeEnv() in the Jenkinsfile — do NOT hardcode them here.

sonar.projectKey=jenkins-docker-sonarqube
sonar.projectName=Jenkins Docker Sonarqube Demo
sonar.projectVersion=1.0

# Sources / tests
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions: drop generated/venv/cache from analysis entirely
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/htmlcov/**,**/*.egg-info/**

# Keep tests in analysis but exclude them from the coverage % so the metric
# reflects production code only.
sonar.coverage.exclusions=tests/**,**/conftest.py
