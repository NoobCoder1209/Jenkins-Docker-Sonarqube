# Jenkins Configuration as Code — full system config baked into the image.
# All credentials below are demo-only; rotate via env vars or proper credential
# providers before any non-toy use.

jenkins:
  systemMessage: "Jenkins-Docker-Sonarqube demo — JCasC managed."
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2
  remotingSecurity:
    enabled: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONARQUBE_TOKEN}"
              description: "SonarQube auth token (demo-only)"

unclassified:
  location:
    url: "http://jenkins:8080/"
    adminAddress: "admin@example.com"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"                       # matches withSonarQubeEnv('sonarqube')
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"
        triggers:
          skipScmCause: false
          skipUpstreamCause: false

tool:
  sonarRunnerInstallation:
    installations:
      - name: "sonar-scanner"                   # matches `tool 'sonar-scanner'` in Jenkinsfile
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "5.0.1.3006"

jobs:
  - script: >
      pipelineJob('demo') {
        description('Lint -> Test -> SonarQube analysis -> quality gate -> docker build. Defined entirely in JCasC + the Jenkinsfile in this repo.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
