name: jenkins-docker-sonarqube

# Self-hosted CI/CD demo: Jenkins + SonarQube + Postgres + a one-shot
# bootstrap container that registers SonarQube's webhook back to Jenkins
# (without it, `waitForQualityGate` in the Jenkinsfile hangs).
#
# All credentials below are demo-only — never reuse in any real environment.
#   docker compose up -d         # bring up the stack
#   docker compose down -v       # tear down + wipe named volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: jds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar          # demo-only
      POSTGRES_PASSWORD: sonar      # demo-only
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [cicd]

  sonarqube:
    image: sonarqube:lts-community
    container_name: jds-sonarqube
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar    # demo-only
      SONAR_JDBC_PASSWORD: sonar    # demo-only
    # Linux hosts: uncomment if SonarQube logs `vm.max_map_count [...] is too low`.
    # Docker Desktop (macOS / Windows) ignores per-container sysctls — its VM
    # already has these raised; no action needed there.
    # sysctls:
    #   vm.max_map_count: "524288"
    #   fs.file-max: "131072"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [cicd]

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: jds-jenkins:local
    container_name: jds-jenkins
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_healthy
    user: root  # demo-only — needed to access the host docker socket
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc_configs/jenkins.yaml
      JENKINS_ADMIN_PASSWORD: admin                                   # demo-only
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-changeme}                   # generated from the SonarQube UI; see README
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/NoobCoder1209/Jenkins-Docker-Sonarqube.git}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      - "50000:50000"
    healthcheck:
      # /manage redirects (302) once Jenkins is fully up and JCasC has loaded.
      # /login 200s on the Jetty error page even when JCasC failed to apply,
      # which is too forgiving for a healthcheck.
      test: ["CMD-SHELL", "curl -fsSL -o /dev/null http://localhost:8080/login && curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/manage | grep -qE '^(200|302|403)$' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [cicd]

  bootstrap:
    # Deliberately NOT a depends_on of `jenkins`: the webhook only needs to
    # exist by the time the first build is triggered, not at Jenkins startup.
    # Coupling the two would create a hard ordering constraint with no benefit.
    image: curlimages/curl:8.10.1
    container_name: jds-bootstrap
    depends_on:
      sonarqube:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/bootstrap-sonar-webhook.sh"]
    environment:
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_ADMIN_USER: admin                # demo-only
      SONARQUBE_ADMIN_PASSWORD: ${SONARQUBE_ADMIN_PASSWORD:-admin}  # change after first login
      JENKINS_WEBHOOK_URL: http://jenkins:8080/sonarqube-webhook/
    restart: "no"
    networks: [cicd]

networks:
  cicd:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  pg_data:
